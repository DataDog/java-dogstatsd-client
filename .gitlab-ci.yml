stages:
  - deploy_to_sonatype
  - create_key

variables:
  REGISTRY: registry.ddbuild.io

.sonatype_release:
  stage: deploy_to_sonatype

  rules:
    # All releases are manual
    - when: manual
      allow_failure: true

  tags:
    - "docker-in-docker:amd64"

  image: $REGISTRY/images/mirror/maven:3.9-eclipse-temurin-17

  variables:
    # Pom of the project to release, relative to the repository root.
    RELEASE_POM: ./pom.xml
    # Extra arguments for the release build, e.g. a version override derived
    # from the git tag. Set by the concrete job, usually in before_script.
    RELEASE_ARGS: ""

  script:
    # Ensure we don't print commands being run to the logs during credential
    # operations
    - set +x

    - echo "Installing AWSCLI..."
    - apt-get update
    - apt-get install -y pipx
    - pipx install awscli
    - export PATH="$PATH:$HOME/.local/bin"
    - echo "Fetching Sonatype user..."
    - export SONATYPE_USER=$(aws ssm get-parameter --region us-east-1 --name ci.java-dogstatsd-client.publishing.sonatype_username --with-decryption --query "Parameter.Value" --out text)
    - echo "Fetching Sonatype password..."
    - export SONATYPE_PASS=$(aws ssm get-parameter --region us-east-1 --name ci.java-dogstatsd-client.publishing.sonatype_password --with-decryption --query "Parameter.Value" --out text)

    - echo "Fetching signing key password..."
    - export GPG_PASSPHRASE=$(aws ssm get-parameter --region us-east-1 --name ci.java-dogstatsd-client.signing.gpg_passphrase --with-decryption --query "Parameter.Value" --out text)

    - echo "Fetching signing key..."
    - gpg_key=$(aws ssm get-parameter --region us-east-1 --name ci.java-dogstatsd-client.signing.gpg_private_key --with-decryption --query "Parameter.Value" --out text)
    - printf -- "$gpg_key" | gpg --import --batch

    - set -x

    - echo "Building release of $RELEASE_POM..."
    - mvn -DperformRelease=true --settings ./settings.xml -f "$RELEASE_POM" $RELEASE_ARGS clean deploy

# From the tagged repo, push the release artifact
deploy_to_sonatype:
  extends: .sonatype_release

  artifacts:
    expire_in: 6 mos
    paths:
      - ./target/*.jar
      - ./target/*.pom
      - ./target/*.asc
      - ./target/*.md5
      - ./target/*.sha1
      - ./target/*.sha256
      - ./target/*.sha512

# Releasing from a dogstatsd-http/vX.Y.Z tag publishes that version, so no pom
# edit is needed to cut a release. From any other ref the pom's own (snapshot)
# version is published.
deploy_dogstatsd_http:
  extends: .sonatype_release
  variables:
    RELEASE_POM: ./dogstatsd-http/pom.xml
  before_script:
    # dogstatsd-http/v1.2.3 -> -Dversion=1.2.3
    - case "$CI_COMMIT_TAG" in dogstatsd-http/v*) export RELEASE_ARGS="-Dversion=${CI_COMMIT_TAG#dogstatsd-http/v}" ;; esac
  artifacts:
    expire_in: 6 mos
    paths:
      - ./dogstatsd-http/core/target/*.jar
      - ./dogstatsd-http/core/target/*.asc
      - ./dogstatsd-http/forwarder/target/*.jar
      - ./dogstatsd-http/forwarder/target/*.asc

# This job creates the GPG key used to sign the releases
create_key:
  stage: create_key
  when: manual

  tags:
    - "docker-in-docker:amd64"

  image: $REGISTRY/ci/agent-key-management-tools/gpg:1

  variables:
    PROJECT_NAME: "java-dogstatsd-client"
    EXPORT_TO_KEYSERVER: "false"

  script:
    - /create.sh

  artifacts:
    expire_in: 13 mos
    paths:
      - ./pubkeys/
